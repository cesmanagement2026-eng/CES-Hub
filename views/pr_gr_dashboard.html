<section id="view-pr_gr_dashboard" class="hidden pr-dashboard" aria-labelledby="prDashboard-title">

    <div class="prDashboard-header-main"><span class="prDashboard-header-icon"><i class="fas fa-file-invoice-dollar"></i></span><div><h2 id="prDashboard-title">PR &amp; GR Dashboard</h2><p>Purchase Requests · Purchase Orders · Goods Receipts · Invoice tracking · 2026</p></div></div>
    <div class="prDashboard-toolbar" aria-label="PR and GR actions">
      <a id="prDashboardSourceLink" class="prDashboard-btn" title="Open linked Google Sheet" href="#" target="_blank" rel="noopener noreferrer" aria-disabled="true"><i class="fas fa-link"></i></a><a class="pr-dashboard-icon" href="https://bdmsgroup-my.sharepoint.com/:x:/r/personal/rachvade_ye_bdms_co_th/Documents/Microsoft%20Teams%20Chat%20Files/All%20Status%20PR%20CES%2028.10.2026.xlsx?d=w694f1f4a56ef4d42a3d834725077af7e&amp;csf=1&amp;web=1&amp;e=h9fKkF" target="_blank" rel="noopener noreferrer" aria-label="Open PR/GR raw data" title="PR/GR Raw Data"><i class="fas fa-table"></i></a>

      <input id="prDashboardFile" type="file" accept=".xlsx,.xls" hidden onchange="cesHubUploadPrGr(this)">

      <button type="button" class="prDashboard-btn" onclick="cesHubLoadPrGr(true)" title="Refresh data"><i class="fas fa-rotate"></i></button>
      <button type="button" class="prDashboard-btn" onclick="cesHubExportPrGrPdf()" title="Export PDF"><i class="fas fa-file-pdf"></i></button>
      <button type="button" class="prDashboard-btn" onclick="cesHubExportPrGrExcel()" title="Export filtered Excel"><i class="fas fa-file-excel"></i></button>
      <button type="button" class="prDashboard-btn" onclick="cesHubResetPrGr()" title="Reset filters"><i class="fas fa-filter-circle-xmark"></i></button>
    </div>
  </header>
  <div class="prDashboard-feedback" id="prDashboardProgress" role="status" aria-live="polite"></div>

  <div id="prDashboardKpis" class="prDashboard-kpis" aria-live="polite"><div class="prDashboard-skeleton">Loading PR &amp; GR data…</div></div>
  <div class="prDashboard-panels"><article class="prDashboard-card"><h3>Monthly PR Amount · Jan–Dec</h3><div class="prDashboard-chart"><canvas id="prDashboardMonthlyChart"></canvas></div></article><article class="prDashboard-card"><h3>PR Status Distribution</h3><div class="prDashboard-chart"><canvas id="prDashboardStatusChart"></canvas></div></article></div>
